[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    live_api: test requires real network access to external APIs
    requires_groq: test requires GROQ_API_KEY
    requires_gemini: test requires GEMINI_API_KEY
    requires_tavily: test requires TAVILY_API_KEY
    mcp_integration: test requires both MCP servers running
